name: Release to PyPI

# Push a tag like v5.0.4 to publish. Uses PyPI Trusted Publishing (OIDC), no secrets.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    if: github.repository == 'telegraphic/hickle'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - name: Check tag matches package version
        run: ls dist/hickle-${GITHUB_REF_NAME#v}.tar.gz || { echo "Tag ${GITHUB_REF_NAME} does not match hickle/__version__.py"; ls dist; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
